[package]
name = "abra_module_core"
version = "0.0.0"
edition = "2024"
license = "MPL-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
abra_core = { workspace = true }
rand = "0.10.4"
glob = "0.3"
jiff = "1"
regex = "1"
sha2 = "0.11"
hmac = "0.13"
hex = "0.4"
base64 = "0.23"
signal-hook = "0.4"
libc = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "charset", "query"] }
bytes = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }

[build-dependencies]
abra_core = { workspace = true }
